<title>여행 일정 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: PC는 왼쪽(오늘 카드 + 여행 정보), 오른쪽 날짜별 열. 폰은 아래 탭(오늘·일정·맛집·정보)으로 한 화면씩.
   Style: Cal.com DESIGN.md — 흰 캔버스, 검정 버튼, 12px 카드, 얇은 선, 색은 꼬리표에만 */
:root {
  --bg: #ffffff; --panel: #ffffff; --ink: #111111; --muted: #6b7280; --line: #e5e7eb;
  --accent: #111111; --accent-ink: #ffffff; --soft: #f3f4f6; --surface: #f9fafb; --link: #2563eb;
  --side: #f9fafb; --hover: #f3f4f6; --active: #e5e7eb; --ink2: #374151;
  --dark: #101010; --dark-ink: #ffffff; --dark-muted: #a1a1aa;
  --c-move: #6b7280; --c-food: #ea580c; --c-sight: #2563eb; --c-shop: #8b5cf6; --c-rest: #059669; --c-stay: #db2777;
  --f-display: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101010; --panel: #1a1a1a; --ink: #f5f5f5; --muted: #a1a1aa; --line: #2a2a2a;
  --accent: #ffffff; --accent-ink: #111111; --soft: #242424; --surface: #161616; --link: #60a5fa;
  --side: #141414; --hover: #202020; --active: #2a2a2a; --ink2: #d4d4d8;
  --dark: #000000; --dark-ink: #ffffff; --dark-muted: #a1a1aa;
  --c-move: #a1a1aa; --c-food: #fb923c; --c-sight: #60a5fa; --c-shop: #a78bfa; --c-rest: #34d399; --c-stay: #f472b6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101010; --panel: #1a1a1a; --ink: #f5f5f5; --muted: #a1a1aa; --line: #2a2a2a;
  --accent: #ffffff; --accent-ink: #111111; --soft: #242424; --surface: #161616; --link: #60a5fa;
  --side: #141414; --hover: #202020; --active: #2a2a2a; --ink2: #d4d4d8;
  --dark: #000000; --dark-ink: #ffffff; --dark-muted: #a1a1aa;
  --c-move: #a1a1aa; --c-food: #fb923c; --c-sight: #60a5fa; --c-shop: #a78bfa; --c-rest: #34d399; --c-stay: #f472b6;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
[hidden] { display: none !important; }

/* 앱 틀: 왼쪽 사이드바 + 본문 (Cal.com 앱 구조) */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.nav { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; }
.nav-in { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 20px; min-height: calc(100vh - 32px); }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.logo svg { width: 16px; height: 16px; }
.brand b { display: block; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.nav-list { display: grid; gap: 2px; }
.nav-list button { display: flex; gap: 10px; align-items: center; justify-content: flex-start; width: 100%; background: transparent; color: var(--ink2); font-weight: 500; font-size: 14px; padding: 8px 10px; border-radius: 6px; text-align: left; }
.nav-list button:hover { background: var(--hover); }
.nav-list button[aria-current="page"] { background: var(--active); color: var(--ink); font-weight: 600; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-foot { margin-top: auto; padding: 8px 10px; }
.save-state { color: var(--muted); font-size: 12px; }
.mtop { display: none; }
main { padding: 32px 40px 72px; min-width: 0; }
.view { display: grid; gap: 24px; max-width: 1080px; }

/* 페이지 머리: 제목·설명 왼쪽, 버튼 오른쪽 */
.ph { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
.ph > div:first-child { min-width: 0; flex: 1 1 320px; }
.ph h1 { font: 600 20px/1.3 var(--f-display); letter-spacing: -.02em; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
.ph .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
.ph .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.ph-act { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: var(--ink2); }

/* 버튼: 검정 기본, 흰 보조 */
button, a.btn { font: inherit; font-size: 14px; font-weight: 600; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.3; }
button.sec, a.sec, button.ghost { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 500; }
a.sec { font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; text-decoration: none; display: inline-flex; align-items: center; line-height: 1.3; }
button.sec:hover, a.sec:hover, button.ghost:hover { background: var(--hover); }
button.sm { padding: 5px 10px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .chip:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
button.danger { color: var(--c-food); }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--c-food); }

/* 입력 */
label.f { display: grid; gap: 6px; font-size: 14px; color: var(--ink); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; width: 100%; box-sizing: border-box; }
textarea { resize: vertical; min-height: 64px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 4px 12px; border: 1px solid var(--line); border-radius: 9999px; font-size: 13px; color: var(--ink); }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.more summary { cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 500; }
.more textarea { margin-top: 6px; }

/* 카드 (설정 화면처럼 아래에 회색 바닥 띠) */
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px 24px; display: grid; gap: 14px; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.card .sub { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
.card-foot { margin: 6px -24px -20px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--surface); border-radius: 0 0 12px 12px; display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.card-foot .status { margin-right: auto; }
.form { max-width: 680px; }
.form .lbl { font-size: 14px; font-weight: 500; display: grid; gap: 8px; }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 24px; text-align: center; margin: 0; }

/* 숙소 입력 */
.stay { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.stay label.f { font-size: 13px; }
.stay-name { display: flex; gap: 6px; }
.stay-name input { min-width: 0; }
.stay-name button { padding: 6px 10px; font-size: 12px; flex: none; }
.loc { font-size: 12px; color: var(--muted); }
.loc.ok { color: var(--c-rest); }
.cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cands li { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.cands li.muted { color: var(--muted); }
.cands a { color: var(--link); flex: none; }
button.cand { flex: 1; min-width: 0; text-align: left; justify-content: flex-start; background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-weight: 400; padding: 6px 8px; display: block; }
button.cand:hover { border-color: var(--ink); }
button.cand b, button.cand small { display: block; }
button.cand small { color: var(--muted); }
button.close { padding: 3px 10px; font-size: 12px; }
.stay-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.stay-foot button { padding: 2px 8px; font-size: 12px; }
.stay-foot a { color: var(--link); text-decoration: none; }

/* 일정: 날짜 고르기 + 날짜별 목록 (Bookings 목록처럼) */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.toolbar .grow { flex: 1; }
.tg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--soft); padding: 3px; border-radius: 8px; }
.tg button { background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 0; }
.tg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.board { display: grid; gap: 20px; min-width: 0; }
.group { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.gh { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.gh .gd { font-weight: 600; }
.gh .gt { color: var(--muted); }
.gh .gr { margin-left: auto; display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.gh a { color: var(--link); text-decoration: none; }
.gh a:hover { text-decoration: underline; }
.slots { list-style: none; margin: 0; padding: 0; min-height: 44px; }
.slot { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 2px 16px; padding: 14px 16px; border-top: 1px solid var(--line); cursor: grab; }
.slot:first-child { border-top: 0; }
.slot:hover { background: var(--hover); }
.slot-ghost { opacity: .35; }
.slots[data-locked="1"] .slot { cursor: default; }
.slots[data-locked="1"] .slot:hover { background: transparent; }
.slot .tm { font-weight: 600; font-variant-numeric: tabular-nums; }
.slot .tm small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.slot .body { min-width: 0; display: grid; gap: 2px; justify-items: start; }
.slot .ttl { font-weight: 600; }
.slot .kind { font-size: 12px; font-weight: 500; color: var(--k, var(--c-move)); background: color-mix(in srgb, var(--k, var(--c-move)) 12%, transparent); border-radius: 6px; padding: 0 8px; }
.slot .place { font-size: 13px; }
.slot .place a { color: var(--link); text-decoration: none; }
.slot .place a:hover { text-decoration: underline; }
.slot .note { font-size: 13px; color: var(--muted); }
.leg { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.leg summary { cursor: pointer; list-style: none; padding: 3px 10px; border-radius: 6px; background: var(--soft); width: fit-content; max-width: 100%; box-sizing: border-box; }
.leg summary::-webkit-details-marker { display: none; }
.leg ul { margin: 4px 0 0; padding-left: 18px; }
.leg li.best { color: var(--ink); font-weight: 500; }
.tail-leg { padding: 10px 16px; border-top: 1px solid var(--line); }
.tail-leg .leg { margin: 0; }
button.add { display: flex; width: 100%; justify-content: flex-start; background: transparent; color: var(--muted); border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 11px 16px; font-weight: 500; font-size: 13px; }
button.add:hover { background: var(--hover); color: var(--ink); }
.tips ul { margin: 0; padding-left: 18px; color: var(--ink2); display: grid; gap: 4px; }

/* 오늘: 예약 확인 화면처럼 무엇·언제·어디 */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.side-col { display: grid; gap: 20px; }
.confirm { padding: 28px; gap: 16px; }
.confirm .ok { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; }
.confirm .ok svg { width: 20px; height: 20px; }
.confirm h2 { margin: 0; font: 600 22px/1.3 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.confirm .sub { margin: -8px 0 0; color: var(--muted); }
.rows { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px 16px; margin: 0; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rows dt { color: var(--muted); font-weight: 500; }
.rows dd { margin: 0; font-weight: 500; min-width: 0; }
.rows dd a { color: var(--link); text-decoration: none; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 48px 10px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .t { font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.tl li.now { font-weight: 600; }
.tl li.now i { background: var(--ink); box-shadow: 0 0 0 3px var(--soft); }
.tl li.done { color: var(--muted); text-decoration: line-through; }
.stat .lbl { color: var(--muted); font-size: 13px; font-weight: 500; }
.stat b { font: 600 28px/1.1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* 맛집 */
.food { display: grid; gap: 14px; }
.food-q { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
.food-q input { flex: 1 1 220px; min-width: 0; }
.food-q select { flex: 0 1 auto; width: auto; }
.food .status { margin: 0; }
.food-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.food-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 14px 16px; border-top: 1px solid var(--line); }
.food-list li:first-child { border-top: 0; }
.food-list .fh b { font-weight: 600; }
.food-list .fh small { margin-left: 8px; color: var(--muted); font-size: 13px; }
.food-list .fr { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; align-items: center; }
.food-list .fr span { border-radius: 6px; padding: 1px 8px; background: var(--soft); color: var(--ink2); font-weight: 500; }
.food-list .fr .rate { color: var(--c-food); background: color-mix(in srgb, var(--c-food) 12%, transparent); }
.food-list .fn { font-size: 13px; color: var(--muted); }
.food-list .fb { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; gap: 6px 12px; align-items: center; font-size: 13px; }
.food-list .fb button { padding: 6px 12px; font-size: 13px; }
.food-list .fb a { color: var(--link); text-decoration: none; }

/* 창 */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 20px; width: min(400px, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 20px 40px rgb(0 0 0 / .15); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
.ed-form { display: grid; gap: 12px; }
.ed-form h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: -.02em; }
.ed-btns { display: flex; gap: 8px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; gap: 12px; align-items: center; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .25); max-width: calc(100vw - 32px); box-sizing: border-box; font-size: 13px; }
#toast button { background: transparent; color: var(--accent-ink); border: 1px solid currentColor; padding: 3px 10px; font-size: 12px; flex: none; }

/* 폰: 사이드바가 아래 탭으로 */
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; border-right: 0; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .nav-in { position: static; min-height: 0; }
  .brand, .nav-foot { display: none; }
  .nav-list { grid-auto-flow: column; grid-auto-columns: 1fr; }
  .nav-list button { flex-direction: column; gap: 3px; justify-content: center; font-size: 11px; padding: 6px 0; }
  .nav-list svg.i { width: 20px; height: 20px; }
  .mtop { display: flex; gap: 10px; align-items: center; }
  .mtop b { font-weight: 600; }
  .mtop small { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; align-content: start; }
  .slot { grid-template-columns: minmax(0, 1fr); }
  .gh .gr { margin-left: 0; }
  .today-grid { grid-template-columns: minmax(0, 1fr); }
  .confirm { padding: 20px; }
  .food-list li { grid-template-columns: minmax(0, 1fr); }
  .food-list .fb { grid-column: 1; grid-row: auto; margin-top: 6px; }
  .card { padding: 16px; }
  .card-foot { margin: 6px -16px -16px; padding: 12px 16px; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  #toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* 한 장으로 저장: 미리보기 창 */
dialog.ex { width: min(1100px, calc(100vw - 32px)); }
.ex-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ex-top h3 { margin: 0 8px 0 0; font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg label { padding: 5px 14px; font-size: 13px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.ex-prev { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.ex-prev .sheet { transform-origin: 0 0; }
/* 저장되는 한 장: 화면 테마와 상관없이 고정 색 */
.sheet { box-sizing: border-box; line-height: 1.4; }
.sheet * { box-sizing: border-box; }
.sheet h1, .sheet h3, .sheet h4, .sheet p, .sheet ol, .sheet ul, .sheet dl { margin: 0; padding: 0; }
.sheet li { list-style: none; }

.sh-diary { width: 1240px; min-height: 1754px; padding: 110px 110px 100px; background: #fdfbf4; color: #3b2b27; font-family: "Gowun Dodum", var(--f-body); position: relative; }
.sh-diary .spark { position: absolute; top: 96px; color: #f0cd72; font-size: 50px; line-height: 1; }
.sh-diary .spark.l { left: 120px; } .sh-diary .spark.r { right: 120px; }
.sh-diary .spark i { font-style: normal; display: block; }
.sh-diary .spark i + i { font-size: 30px; margin: -4px 0 0 46px; }
.sh-diary .spark i + i + i { font-size: 24px; margin: 0 0 0 14px; }
.sh-diary h1 { font: 400 84px/1.25 "Jua", var(--f-display); text-align: center; }
.sh-diary h1 em { font-style: normal; color: #d8433e; position: relative; }
.sh-diary h1 em::after { content: ""; position: absolute; left: -2%; right: -10%; bottom: 4px; height: 4px; border-radius: 4px; background: #d8433e; transform: rotate(-1.5deg); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
const LIKES = ["맛집", "카페", "쇼핑", "온천", "근교 여행", "야경", "역사·문화", "자연", "술집"];
const KINDS = { "이동": "--c-move", "식사": "--c-food", "관광": "--c-sight", "쇼핑": "--c-shop", "휴식": "--c-rest", "숙소": "--c-stay" };
const FIELDS = ["dest", "start", "end", "arrive", "depart", "people", "who", "pace", "must", "eat", "avoid"];

const EXAMPLE = {
  example: true,
  title: "후쿠오카 2박 3일",
  summary: "하카타에 묵으면서 시내 먹방과 다자이후 반나절을 넣은 예시 일정이에요. 왼쪽에 여행 정보를 넣고 ‘일정 만들기’를 누르면 내 일정으로 바뀌어요.",
  days: [
    { date: "", label: "1일차", theme: "도착하고 하카타·나카스 산책", items: [
      { time: "11:30", end: "12:30", type: "이동", title: "공항 → 하카타역", place: "후쿠오카 공항", note: "지하철 공항선 5분" },
      { time: "12:30", end: "13:30", type: "식사", title: "하카타 라멘 점심", place: "하카타 라멘 이치란 본점", note: "" },
      { time: "15:00", end: "16:00", type: "숙소", title: "체크인", place: "하카타역", note: "" },
      { time: "16:30", end: "18:30", type: "관광", title: "쿠시다 신사, 캐널시티", place: "쿠시다 신사", note: "캐널시티 분수쇼는 매시 정각" },
      { time: "19:00", end: "21:00", type: "식사", title: "나카스 포장마차", place: "나카스 야타이", note: "현금 준비" } ] },
    { date: "", label: "2일차", theme: "다자이후 반나절, 텐진 쇼핑", items: [
      { time: "09:30", end: "10:15", type: "이동", title: "니시테츠 텐진 → 다자이후", place: "니시테츠 후쿠오카(텐진)역", note: "" },
      { time: "10:15", end: "12:30", type: "관광", title: "다자이후 텐만구", place: "다자이후 텐만구", note: "참배길 우메가에모치" },
      { time: "13:30", end: "14:30", type: "식사", title: "텐진 점심", place: "텐진", note: "" },
      { time: "14:30", end: "18:00", type: "쇼핑", title: "텐진 지하상가, 다이묘", place: "텐진 지하상가", note: "" },
      { time: "19:00", end: "21:00", type: "식사", title: "모츠나베 저녁", place: "모츠나베 라쿠텐치", note: "예약 권장" } ] },
    { date: "", label: "3일차", theme: "오호리 공원 산책 후 귀국", items: [
      { time: "09:00", end: "10:30", type: "휴식", title: "오호리 공원 산책, 카페", place: "오호리 공원", note: "" },
      { time: "11:00", end: "12:00", type: "쇼핑", title: "하카타역 기념품", place: "하카타역 아뮤플라자", note: "" },
      { time: "12:30", end: "13:00", type: "이동", title: "하카타역 → 공항", place: "후쿠오카 공항 국제선", note: "출발 2시간 전 도착" } ] }
  ],
  tips: ["교통은 지하철 1일권보다 IC카드(스이카, 하야카켄 등) 충전이 편해요.", "포장마차는 현금만 받는 곳이 많아요."]
};

const $ = (id) => document.getElementById(id);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") el.style.cssText = v; else if (k === "class") el.className = v; else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== "") el.append(k instanceof Node ? k : String(k));
  return el;
}

// 취향 칩
for (const l of LIKES) $("likes").append(h("label", { class: "chip" }, h("input", { type: "checkbox", value: l, id: "like-" + l }), h("span", {}, l)));

// 숙소 (여러 곳, 각자 체크인~체크아웃 = 연박)
function nights(a, b) {
  if (!a || !b) return 0;
  return Math.max(0, Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5));
}
let stayN = 0;
function addStay(s = {}) {
  const rows = $("stays").children, n = ++stayN;
  const prevOut = rows.length ? rows[rows.length - 1].querySelector("[data-k=out]").value : $("start").value;
  const name = h("input", { "data-k": "name", id: "stay-name-" + n, placeholder: "숙소 이름 (예: WBF 그란데 하카타)" });
  const find = h("button", { type: "button", class: "ghost find-stay" }, "🔎 찾기");
  const cands = h("ul", { class: "cands", hidden: "" });
  const cin = h("input", { "data-k": "in", id: "stay-in-" + n, type: "date", "aria-label": "체크인" });
  const cout = h("input", { "data-k": "out", id: "stay-out-" + n, type: "date", "aria-label": "체크아웃" });
  name.value = s.name || ""; cin.value = s.in ?? prevOut ?? ""; cout.value = s.out ?? $("end").value ?? "";
  const info = h("span");
  const loc = h("span", { class: "loc" });
  const map = h("a", { target: "_blank", rel: "noopener" }, "📍 지도");
  const del = h("button", { type: "button", class: "ghost" }, "삭제");
  const row = h("div", { class: "stay" },
    h("div", { class: "stay-name" }, name, find), cands, loc,
    h("div", { class: "row2" }, h("label", { class: "f" }, "체크인", cin), h("label", { class: "f" }, "체크아웃", cout)),
    h("div", { class: "stay-foot" }, info, h("span", { style: "display:flex;gap:10px;align-items:center" }, map, del)));
  const upd = () => {
    const k = nights(cin.value, cout.value), v = name.value.trim(), c = state.coords[v];
    info.textContent = k ? `${k}박${k > 1 ? " (연박)" : ""}` : "날짜를 넣으면 박 수가 나와요";
    map.hidden = !v;
    map.href = c ? `https://www.google.com/maps/search/?api=1&query=${c[0]},${c[1]}` : mapUrl(v, $("dest").value.trim());
    loc.textContent = !v ? "" : c ? "✓ 위치 확인됨" : "위치 미확인 · ‘찾기’로 후보에서 골라주세요";
    loc.classList.toggle("ok", !!c);
  };
  for (const el of [name, cin, cout]) el.addEventListener("input", upd);
  document.addEventListener("coords", upd);  // 위치 찾기가 끝나면 표시 갱신
  upd();

  // 후보 찾기: Claude가 아는 실제 숙소 중 이름이 비슷한 곳을 최대 5개
  async function search() {
    const q = name.value.trim();
    if (!q) return name.focus();
    if (!sample) { loc.textContent = "이 화면에서는 찾기를 쓸 수 없어요."; return; }
    find.disabled = true; cands.hidden = false;
    cands.replaceChildren(h("li", { class: "muted" }, "후보를 찾는 중이에요…"));
    try {
      const r = await sample.json(
        `여행지: ${$("dest").value.trim() || "미정"}\n사용자가 숙소 이름을 "${q}"라고 적었어. 실제로 있는 숙소(호텔·료칸 등) 중 이 이름에 맞는 후보를 최대 5개 알려줘. ` +

  const li = e.target.closest(".slot"); if (!li) return;
  const key = li.parentElement.dataset.key;
  if (li.parentElement.dataset.locked === "1") return;
  const k = key === "bucket" ? "bucket" : +key;
  openEditor(k, listOf(k).find((x) => x._id === li.dataset.id));
});
$("board").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("slot")) e.target.click(); });

// ---- 오늘 카드: 여행 중이면 오늘, 여행 전이면 1일차, 끝났으면 마지막 날 ----
const ymd = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
const iyeyo = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c < 11172 && c % 28 === 0 ? "예요" : "이에요"; };
function todayPick(now = new Date()) {
  const days = state.plan.days, t = ymd(now);
  let i = days.findIndex((d) => d.date === t), note = "";
  if (i < 0) {
    const before = !days[0]?.date || t < days[0].date;
    i = before ? 0 : days.length - 1;
    const left = days[0]?.date ? Math.round((new Date(days[0].date + "T00:00:00") - new Date(t + "T00:00:00")) / 864e5) : 0;
    note = before ? (left > 0 ? `출발 ${left}일 전 · 미리보기` : "미리보기") : "여행이 끝났어요";
  }
  const items = days[i].items || [], mins = now.getHours() * 60 + now.getMinutes();
  // 다음 일정: 여행 중이면 아직 시작 안 한 첫 일정(없으면 -1), 아니면 첫 일정
  const nx = note ? (items.length ? 0 : -1) : items.findIndex((it) => toMin(it.time) == null || toMin(it.time) > mins);
  return { i, d: days[i], items, note, nx };
}
function renderToday() {
  const el = $("todayBody");
  if (!state.plan?.days?.length) { $("todaySub").textContent = ""; return el.replaceChildren(); }
  const p = state.plan, { i, d, items, note, nx } = todayPick();
  const x = new Date(d.date + "T00:00:00"), next = items[nx];
  $("todaySub").textContent = (d.date ? `${i + 1}일차 · ${x.getMonth() + 1}월 ${x.getDate()}일 ${"일월화수목금토"[x.getDay()]}요일` : `${i + 1}일차`) + (note ? ` · ${note}` : "");
  const from = next ? (nx > 0 ? placeOf(items[nx - 1]) : (i > 0 ? stayOn(p.days[i - 1].date)?.name : null)) : null;
  const L = next && from ? state.legs[legKey(from, placeOf(next))] : null, o = L && (L.opts[L.best] || L.opts[0]);
  const c = next && state.coords[placeOf(next)];
  const dest = next ? (c ? c.join(",") : `${placeOf(next)} ${state.form?.dest || ""}`.trim()) : "";
  const fare = p.example ? null : dayFare(d, i);
  const rows = next ? [
    ["무엇", next.title],
    ["언제", `${next.time || "시간 미정"}${next.end ? " – " + next.end : ""}`],
    ["어디", mapLink(placeOf(next), "")],
    o ? ["가는 법", `${MODE_ICON[o.mode] || "🚃"} ${o.mode}${o.detail ? " " + o.detail : ""} · ${o.min}분${o.yen ? " · " + yen(perPerson(o)) + "/인" : ""}`] : null,
    next.note ? ["메모", next.note] : null].filter(Boolean) : [];
  el.replaceChildren(h("div", { class: "today-grid" },
    h("div", { class: "card confirm" },
      h("div", { class: "ok", "aria-hidden": "true" }, svgIcon(next ? "M12 7v5l3 2|c" : "M5 12l5 5L20 7")),
      h("h2", {}, next ? `${note ? "첫 일정은" : "다음은"} ${next.title}${iyeyo(next.title)}` : "오늘 일정을 모두 마쳤어요"),
      next ? h("p", { class: "sub" }, from ? `${from}에서 출발해요.` : "여행의 첫 일정이에요.") : null,
      rows.length ? h("dl", { class: "rows" }, rows.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])) : null,
      h("div", { class: "acts" },
        next ? h("a", { class: "btn", href: `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=transit`, target: "_blank", rel: "noopener" }, "길찾기") : null,
        btnEl("이 날 일정 보기", "sec", () => { planSel = i; setView("plan"); render(); }))),
    h("div", { class: "side-col" },
      h("div", { class: "card" }, h("h3", {}, note ? `${i + 1}일차 일정` : "오늘 일정"),
        items.length ? h("ul", { class: "tl" }, items.map((it, j) => h("li", { class: j === nx ? "now" : !note && (nx < 0 || j < nx) ? "done" : "" },
          h("span", { class: "t" }, it.time || "–"), h("i"), h("span", {}, it.title)))) : h("p", { class: "sub" }, "아직 일정이 없어요.")),
      fare == null ? null : h("div", { class: "card stat" }, h("span", { class: "lbl" }, `${note ? `${i + 1}일차` : "오늘"} 교통비 (1인, 예상)`), h("b", {}, yen(fare))))));
}
// 작은 선 아이콘: "경로|c" 면 시계 원을 같이 그림
function svgIcon(spec) {
  const [d, circle] = spec.split("|"), ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i");
  if (circle) { const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", 12); c.setAttribute("cy", 12); c.setAttribute("r", 9); s.append(c); }
  const path = document.createElementNS(ns, "path"); path.setAttribute("d", d); s.append(path);
  return s;
}
setInterval(renderToday, 60000);  // 시간이 지나면 다음 일정이 바뀜
// 화면 전환 (PC는 사이드바, 폰은 아래 탭)
let viewTouched = false;
function setView(v) {
  for (const s of document.querySelectorAll(".view")) s.hidden = s.id !== "v-" + v;
  for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false");
}
for (const b of document.querySelectorAll("[data-view]")) b.onclick = () => { viewTouched = true; setView(b.dataset.view); scrollTo(0, 0); };
setView("plan");

// ---- 저장 (db, 없으면 이 브라우저에만) ----
let db = null, docRef = null, writing = Promise.resolve(), saveTimer;
const LS = "trip-board";
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} }
function save() {
  saveLocal();
  if (!docRef) return;
  const body = JSON.parse(JSON.stringify({ form: state.form, plan: state.plan.example ? null : state.plan, bucket: state.bucket, coords: state.coords, legs: state.legs, food: { q: food.q, day: food.day, meal: food.meal, list: food.list }, updatedAt: new Date().toISOString() }));
  writing = writing.then(() => docRef.set(body)).then(
    () => { $("saveState").textContent = "저장됨"; },
    (e) => { $("saveState").textContent = e?.code === "invalid_argument" ? "보기 전용이라 저장할 수 없어요" : "저장 실패. 잠시 후 다시 바뀌면 저장돼요"; });
}
$("form").addEventListener("input", () => {
  state.form = readForm();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); render(); }, 800);  // 숙소·여행지가 바뀌면 지도 링크도 갱신
});

try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s?.plan) { state = { form: s.form || null, plan: s.plan, bucket: s.bucket || [], coords: s.coords || {}, legs: s.legs || {} }; fillForm(s.form || {}); } } catch {}
if (!$("stays").children.length) addStay();
render();

const loaded = (async () => {
  db = await claude.use("db").catch(() => null);
  if (!db) { $("saveState").textContent = "이 브라우저에만 저장돼요"; return; }
  docRef = db.doc("trips/current");
  try {
    const snap = await docRef.get();
    if (snap.exists) {
      const d = structuredClone(snap.data());  // 스냅샷은 얼어 있어서 복사해야 드래그·편집이 반영됨
      state = { form: d.form || null, plan: d.plan || EXAMPLE, bucket: d.bucket || [], coords: d.coords || {}, legs: d.legs || {} };
      if (d.food) Object.assign(food, d.food, { busy: false, msg: d.food.list?.length ? "지난번 찾은 결과예요." : "" });  // 마지막 맛집 검색 결과 유지
      fillForm(d.form || {});
      render();
    }
    $("saveState").textContent = "자동 저장 켜짐";
  } catch { $("saveState").textContent = "저장소를 읽지 못했어요. 이 브라우저에만 저장돼요"; docRef = null; }
})();

loaded.then(() => { if (!viewTouched && state.plan?.days?.length && !todayPick().note) setView("today"); });  // 여행 중이면 '오늘'부터

// ---- Claude로 일정 만들기 ----
let sample, busy = false;
(async () => {
  sample = await claude.use("sample").catch(() => null);
  if (!sample) { $("gen").disabled = true; $("status").textContent = "이 화면에서는 일정 자동 작성을 쓸 수 없어요."; return; }
  await loaded;
  enrich();  // 저장된 일정을 불러온 뒤, 위치 없는 곳이 있으면 한 번 찾아둠
})();

function dayList(f) {
  if (!f.start || !f.end) return [];
  const out = [], d = new Date(f.start + "T00:00:00"), e = new Date(f.end + "T00:00:00");
  while (d <= e && out.length < 31) { out.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function promptFor(f, editReq) {
  const days = dayList(f);
  const shape = `{"title": string, "summary": string(2문장 이내), "days": [{"date": "YYYY-MM-DD", "label": "1일차", "theme": string, "items": [{"time": "HH:MM", "end": "HH:MM", "type": "이동"|"식사"|"관광"|"쇼핑"|"휴식"|"숙소", "title": string, "place": string(지도에서 검색 가능한 실제 장소명), "lat": number(위도), "lng": number(경도), "note": string(짧게, 없으면 "")}]}], "tips": [string, 최대 4개]}`;
  const info = [
    `여행지: ${f.dest}`,
    `날짜: ${days.length ? days.join(", ") : "미정(2박 3일로 가정)"}`,
    `첫날 현지 도착: ${f.arrive || "미정(오전 도착 가정)"}, 마지막 날 귀국편 출발: ${f.depart || "미정(오후 출발 가정)"}`,
    `인원: ${f.people || 2}명${f.who ? ", 동행: " + f.who : ""}, 일정 강도: ${f.pace}`,
    `숙소: ${f.stays.length ? "\n" + f.stays.map((s, i) => `  ${i + 1}) ${s.name || "이름 미정"}: ${s.in || "?"} 체크인 ~ ${s.out || "?"} 체크아웃 (${nights(s.in, s.out)}박)`).join("\n") : "미정(교통 좋은 곳으로 가정)"}`,
    `취향: ${f.likes.join(", ") || "특별히 없음"}`,
    `꼭 하고 싶은 것: ${f.must || "없음"}`,
    `먹고 싶은 것: ${f.eat || "없음"} (식사 일정에 빠짐없이 넣고, 동선에 맞는 실제 가게를 골라줘)`,
    `피하고 싶은 것: ${f.avoid || "없음"}`
  ].join("\n");
  let p = `너는 여행 일정 플래너야. 아래 정보로 현실적인 날짜별 일정을 한국어로 짜줘.\n` +
    `- 이동 시간과 동선을 실제 지리에 맞게 고려하고, 첫날은 도착 후부터, 마지막 날은 출발 2시간 전 공항 도착으로 끝내.\n` +
    `- 장소는 실제로 존재하는 곳만. 식사는 하루 2~3번.\n` +
    `- 숙소가 여러 곳이면 그날 밤 묵는 숙소 기준으로 동선을 짜. 숙소가 바뀌는 날은 체크아웃, 짐 이동(필요하면 코인로커), 새 숙소 체크인을 일정에 넣어. 연박 중간 날은 체크인·체크아웃 없이 짜.\n` +
    `- 동행 유형에 맞춰 장소·식당·분위기를 골라. 예: 연인은 분위기 좋은 곳과 야경, 아이 동반은 이동을 짧게 하고 쉬는 시간과 아이가 즐길 곳, 부모님 동반은 덜 걷고 편한 식당, 친구끼리는 술집·액티비티, 혼자는 혼밥하기 편한 곳.\n` +
    `- 시간순 정렬.\n\n[여행 정보]\n${info}\n`;
  if (editReq) p += `\n[현재 일정]\n${JSON.stringify(state.plan)}\n\n[수정 요청]\n${editReq}\n요청한 부분만 고치고 나머지는 최대한 유지해.\n`;
  return p + `\n다른 말 없이 이 JSON 하나만 답해:\n${shape}`;
}

async function generate(editReq) {
  if (!sample || busy) return;
  const f = readForm();
  if (!f.dest) { $("status").className = "status err"; $("status").textContent = "여행지를 먼저 적어주세요."; $("dest").focus(); return; }
  busy = true;
  for (const b of [$("gen"), $("editBtn")]) if (b) b.disabled = true;
  $("status").className = "status";
  $("status").textContent = "일정을 짜는 중이에요… (보통 30초~1분)";
  try {
    const plan = await sample.json(promptFor(f, editReq), {
      cache: false,
      onText: ({ text }) => { $("status").textContent = `일정을 쓰는 중이에요… ${text.length.toLocaleString()}자`; }
    });
    if (!plan || !Array.isArray(plan.days)) throw { code: "invalid_json" };
    for (const day of plan.days) for (const x of day.items || []) {
      if (typeof x.lat === "number" && typeof x.lng === "number" && placeOf(x)) state.coords[placeOf(x)] = [x.lat, x.lng];
      delete x.lat; delete x.lng;
    }
    state = { form: f, plan, bucket: state.bucket, coords: state.coords, legs: state.legs };
    planSel = null; render(); setView("plan");
    save();
    $("status").textContent = editReq ? "일정을 고쳤어요." : "일정을 만들었어요. 일정 화면 아래에서 고칠 점을 요청할 수도 있어요.";
    busy = false;
    enrich();
  } catch (e) {
    $("status").className = "status err";
    $("status").textContent = ({
      not_granted: "Claude 사용을 허용해야 일정을 만들 수 있어요.",
      sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어요.",
      rate_limited: "요청이 많아요. 잠시 후 다시 눌러주세요.",
      session_expired: "다시 로그인한 뒤 눌러주세요.",
      invalid_json: "일정 형식이 깨졌어요. 다시 한 번 눌러주세요."
    })[e?.code] || "일정을 만들지 못했어요. 다시 눌러주세요.";
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") sample = null;
  } finally {
    busy = false;
    for (const b of [$("gen"), $("editBtn")]) if (b) b.disabled = !sample;
  }
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); generate(); });
</script>
