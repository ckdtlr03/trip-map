<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여행 동선 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef1f4; --panel: #fff; --ink: #1d2a3a; --muted: #5f6d7e; --line: #d6dde5; --accent: #1f6f8b; --soft: #e3eef2;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root { --bg: #121820; --panel: #1b2430; --ink: #e4eaf1; --muted: #9aa7b6; --line: #2d3a4a; --accent: #5bb4d1; --soft: #1f3340; color-scheme: dark; } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 100%; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; } #map { order: -1; } }
aside { overflow: auto; padding: 16px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); background: var(--panel); }
h1 { font: 400 24px var(--f-display); margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.sum { font-size: 13px; color: var(--muted); }
.sum b { color: var(--ink); font-family: var(--f-mono); }
.g { display: inline-block; font-weight: 700; font-size: 13px; text-decoration: none; background: var(--accent); color: #fff; border-radius: 6px; padding: 7px 12px; }
.day h2 { font: 400 17px var(--f-display); margin: 8px 0 4px; display: flex; gap: 8px; align-items: center; }
.day h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); cursor: pointer; }
li:hover { background: var(--soft); }
li .n { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; font: 700 11px/22px var(--f-mono); text-align: center; }
li .n.stay { background: #4a5a8c; }
li small { display: block; color: var(--muted); font-size: 12px; }
li .km { font-family: var(--f-mono); }
li.miss { opacity: .55; cursor: default; }
.pin { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 700 11px/24px var(--f-mono); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .4); }
.empty { color: var(--muted); }
#map { height: 100%; min-height: 300px; }
</style>
</head>
<body>
<aside id="side"><h1>여행 동선 지도</h1><p class="empty">여행 일정 보드의 "🗺 지도" 버튼으로 열어주세요.</p></aside>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = ["#1f6f8b", "#c2571a", "#3f8f5a", "#8a4fb0", "#b8892b", "#c23b6a", "#2f7fd1", "#6b7a1f"];
// 데이터: #<base64url(JSON)>  {t: 제목, sel: 날짜 번호|null, d: [{n: 이름, s: [[장소, lat, lng, 시각, 종류]]}]}
function decode(h) {
  try {
    const b = atob(h.replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, (c) => c.charCodeAt(0))));
  } catch { return null; }
}
function km(a, b) {
  const R = 6371, r = (x) => x * Math.PI / 180;
  const dLat = r(b[1] - a[1]), dLng = r(b[2] - a[2]);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[1])) * Math.cos(r(b[1])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmt = (k) => k < 1 ? Math.round(k * 1000) + "m" : k.toFixed(1) + "km";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const has = (s) => typeof s[1] === "number" && typeof s[2] === "number";

function gRoute(stops) {
  const p = stops.filter(has).map((s) => s[1] + "," + s[2]);
  if (p.length < 2) return null;
  // ponytail: 구글 지도 경유지 최대 9곳(모바일 3곳)
  const mid = p.slice(1, -1).slice(0, 9).join("%7C");
  return `https://www.google.com/maps/dir/?api=1&origin=${p[0]}&destination=${p.at(-1)}${mid ? "&waypoints=" + mid : ""}`;
}

if (typeof L !== "undefined") {
  const data = decode(location.hash.slice(1));
  const map = L.map("map").setView([33.59, 130.40], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const layer = L.layerGroup().addTo(map);

  function show(sel) {
    layer.clearLayers();
    const side = document.getElementById("side");
    const days = data.d.map((d, i) => ({ ...d, i, c: COLORS[i % COLORS.length] }));
    const vis = sel == null ? days : [days[sel]];
    const bounds = [];
    let total = 0, body = "";
    for (const d of vis) {
      const pts = d.s.filter(has);
      let dayKm = 0, prev = null, n = 0;
      const rows = d.s.map((s) => {
        const stay = s[4] === "숙소";
        const label = stay ? "🛏" : ++n;
        if (!has(s)) return `<li class="miss" style="--c:${d.c}"><span class="n">${label}</span><span>${esc(s[0])}<small>위치를 못 찾았어요</small></span></li>`;
        const step = prev ? km(prev, s) : 0; dayKm += step; prev = s;
        L.marker([s[1], s[2]], { icon: L.divIcon({ className: "", html: `<div class="pin" style="background:${stay ? "#4a5a8c" : d.c}">${label}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) })
          .bindPopup(`<b>${esc(s[0])}</b><br>${esc(d.n)} ${esc(s[3] || "")} ${esc(s[4] || "")}`).addTo(layer);
        bounds.push([s[1], s[2]]);
        return `<li data-ll="${s[1]},${s[2]}" style="--c:${d.c}"><span class="n${stay ? " stay" : ""}">${label}</span><span>${esc(s[0])}<small>${esc(s[3] || "")}${step ? ` · 이전 장소에서 <span class="km">${fmt(step)}</span>` : ""}</small></span></li>`;
      }).join("");
      if (pts.length > 1) L.polyline(pts.map((s) => [s[1], s[2]]), { color: d.c, weight: 4, opacity: .8, dashArray: sel == null ? "6 6" : null }).addTo(layer);
      total += dayKm;
      const g = gRoute(d.s);
      body += `<div class="day" style="--c:${d.c}"><h2><i></i>${esc(d.n)}</h2>` +
        `<div class="sum">직선거리 합계 <b>${fmt(dayKm)}</b></div>` +
        (sel != null && g ? `<p><a class="g" href="${g}" target="_blank" rel="noopener">구글 지도로 길찾기</a></p>` : "") +
        `<ol>${rows}</ol></div>`;
    }
    side.innerHTML = `<h1>${esc(data.t || "여행 동선 지도")}</h1><div class="tabs">` +
      `<button data-s="" aria-pressed="${sel == null}" style="--c:#1d2a3a">전체</button>` +
      days.map((d) => `<button data-s="${d.i}" aria-pressed="${sel === d.i}" style="--c:${d.c}">${esc(d.n)}</button>`).join("") + `</div>` +
      (sel == null ? `<div class="sum">전체 직선거리 <b>${fmt(total)}</b> · 실제 이동 거리는 이보다 길어요</div>` : "") + body;
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
    else side.querySelector(".tabs").insertAdjacentHTML("afterend", `<p class="sum">아직 위치 정보가 없어요. 일정 보드에서 <b>📍 위치 찾기</b>가 끝난 뒤 지도 버튼을 다시 눌러주세요.</p>`);
    side.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => show(b.dataset.s === "" ? null : +b.dataset.s));
    side.querySelectorAll("li[data-ll]").forEach((li) => li.onclick = () => map.setView(li.dataset.ll.split(",").map(Number), 16));
  }
  if (data?.d?.length) show(Number.isInteger(data.sel) ? data.sel : null);
}
</script>
</body>
</html>
